# SENTRANET — Risk Fusion & Forecasting Engine Configuration (Phase 5)

risk:
  fusion:
    classification_weight: 0.6
    anomaly_weight: 0.4

  thresholds:
    low_upper: 0.24
    guarded_upper: 0.49
    elevated_upper: 0.74

  trend:
    rising_velocity: 0.02
    rapid_velocity: 0.05
    rapid_acceleration: 0.01

forecast:
  minimum_history_windows: 3
  minimum_persistence_windows: 2

  horizons_minutes:
    - 1
    - 2
    - 5
    - 10
    - 15

  emergence_threshold: 0.50
  target_risk_threshold: 0.75

  confidence:
    classification_weight: 0.4
    trend_weight: 0.3
    anomaly_weight: 0.3
